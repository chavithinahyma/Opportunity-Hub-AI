kind = "web"
previewPath = "/"
title = "Opportunity Hub AI"
description = "A focused opportunity discovery app for finding, saving, and applying to jobs, internships, government programs, hackathons, and private roles."
version = "1.0.0"
id = "artifacts/opportunity-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23573

[services.development]
run = "pnpm --filter @workspace/opportunity-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/opportunity-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/opportunity-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23573"
BASE_PATH = "/"
