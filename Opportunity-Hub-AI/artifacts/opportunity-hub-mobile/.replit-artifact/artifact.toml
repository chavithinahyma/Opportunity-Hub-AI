kind = "mobile"
previewPath = "/mobile/"
title = "Opportunity Hub Mobile"
description = "A mobile Opportunity Hub companion for discovering, saving, and applying to curated career opportunities from Expo Go."
version = "1.0.0"
id = "artifacts/opportunity-hub-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20952

[services.development]
run = "pnpm --filter @workspace/opportunity-hub-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/opportunity-hub-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/opportunity-hub-mobile", "run", "serve" ]

[services.env]
PORT = "20952"
BASE_PATH = "/mobile/"
